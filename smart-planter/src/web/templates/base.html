<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!--スマホやタブレットなどで正しく表示するための設定-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>{% block title %}すくすくミントちゃん{% endblock %}</title>
   
    <!-- Bootstrap CSSを読み込み -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- グラフを表示するためのChart.jsライブラリを読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Flaskなどでリアルタイム通信を行うSocket.IOを読み込み -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Flaskの静的ファイル（カスタムCSS）を読み込み -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
   
    <!-- ページごとに追加のヘッダー要素を入れられるブロック -->
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- ナビゲーションバー -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-seedling"></i> すくすくミントちゃん
            </a>
 
            <!-- 画面がちいさいとき（スマホなどに）メニューを折りたたむボタン -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
           
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">
                            <i class="fas fa-home"></i> ダッシュボード
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('settings') }}">
                            <i class="fas fa-cog"></i> 設定
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logs') }}">
                            <i class="fas fa-file-alt"></i> ログ
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
 
    <!-- メインコンテンツ -->
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>
 
    <!-- フッター -->
    <footer class="bg-light mt-5 py-4">
        <div class="container text-center">
            <p class="text-muted mb-0">
                &copy; 2025 すくすくミントちゃん - チームKEBABS
                <!-- &copy;は著作権マーク -->
            </p>
        </div>
    </footer>
 
    <!-- Bootstrap JS （ボタン開閉などを動かす）-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- カスタムJS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
 
    <!-- ページごとに追加のスクリプトを入れられるブロック -->
    {% block extra_scripts %}{% endblock %}
</body>
</html>
